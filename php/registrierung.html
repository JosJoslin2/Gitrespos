<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Registrierung</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <nav class="navbar">
        <div class="logo">Joslin_Gruppe</div>
        <a href="login.html">
            <button class="cart-btn">🔑 Login</button>
        </a>
      </nav>
    </header>

    <main>
      <section class="form-section">
        <h2>📝 Neues Konto erstellen</h2>

        <div class="form-group">
            <label>👤 Vorname</label>
            <input type="text" id="vorname" placeholder="Dein Vorname">
        </div>

        <div class="form-group">
            <label>👤 Nachname</label>
            <input type="text" id="nachname" placeholder="Dein Nachname">
        </div>

        <div class="form-group">
            <label>📧 Email</label>
            <input type="email" id="email" placeholder="Deine Email">
        </div>

        <div class="form-group">
            <label>🔒 Passwort</label>
            <input type="password" id="passwort" placeholder="Dein Passwort">
        </div>

        <button class="order-btn" id="registrierBtn">✅ Registrieren</button>

      </section>
    </main>

    <footer>
      <p>© 2026 KonzertTickets – Alle Rechte vorbehalten</p>
    </footer>

    <script src="js/registrierung.js"></script>
  </body>
</html>
