<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>KonzertTicket</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <nav class="navbar">
        <div class="logo">Joslin_Gruppe</div>
        <button class="cart-btn" id="cartBtn">
          🛒 Warenkorb(<span id="cartCount">0</span>)
        </button>
      </nav>
    </header>

    <main>

      <section class="hero">
        <h1>Deine Lieblingskonzerte</h1>
        <p>Jetzt Tickets kaufen und unvergessliche Momente erleben!</p>
      </section>

      <!-- KONZERT LISTE -->
      <section class="concerts-section">
        <h2>Aktuelle Konzerte</h2>
        <div class="concerts-grid" id="concertsGrid">
        </div>
      </section>

      <section class="cart-section" id="cartSection" style="display: none;">
        <h2>🛒 Dein Warenkorb</h2>
        <div id="cartItems"></div>
        <div class="cart-total">
          <strong>Gesamt: <span id="cartTotal">0</span> €</strong>
        </div>
        <button class="order-btn" id="orderBtn">Jetzt bestellen</button>
      </section>

      <section class="form-section" id="formSection" style="display: none;">
        <h2> Deine Daten</h2>

        <div class="form-group">
          <label> Vorname</label>
          <input type="text" id="vorname" placeholder="Dein Vorname">
        </div>

        <div class="form-group">
          <label> Name</label>
          <input type="text" id="name" placeholder="Dein Nachname">
        </div>

        <div class="form-group">
          <label>🏠 Adresse</label>
          <input type="text" id="adresse" placeholder="Deine Adresse">
        </div>

        <div class="form-group">
          <label>📞 Telefonnummer</label>
          <input type="tel" id="telefon" placeholder="Deine Telefonnummer">
        </div>

        <div class="form-group">
          <label>📧 Email</label>
          <input type="email" id="email" placeholder="Deine Email">
        </div>

        <button class="order-btn" id="submitBtn">✅ Bestellung abschicken</button>
      </section>

    </main>
    <!-- BESTÄTIGUNG -->
    <section class="confirm-section" id="confirmSection" style="display: none;">
    <div class="confirm-box">
        <h1>🎉</h1>
        <h2>Fast fertig!</h2>
        <p id="confirmName"></p>
        <p>Gesamtbetrag: <strong id="confirmTotal"></strong> €</p>
        <p>Klicke auf PayPal um zu bezahlen!</p>

        <!-- PAYPAL BUTTON -->
        <a id="paypalBtn" href="#" target="_blank">
            <img src="https://www.paypalobjects.com/webstatic/en_US/i/buttons/PP_logo_h_150x38.png" 
                 alt="PayPal">
        </a>

        <br><br>
        <button class="order-btn" id="newOrderBtn">🎵 Neue Bestellung</button>
    </div>
</section>
    <footer>
      <p>© 2026 KonzertTickets – Alle Rechte vorbehalten</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
