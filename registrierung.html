<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Registrierung - KonzertTickets</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">Joslin_Gruppe</div>
        <a href="Ticket.html">
          <button class="cart-btn">🎵 Home</button>
        </a>
        <a href="login.html">
          <button class="cart-btn">🔑 Login</button>
        </a>
      </nav>
    </header>
    <main>
      <section class="form-section">

        <div id="errorBox" style="display:none;"></div>
        <div id="successBox" style="display:none;"></div>

        <h2>📝 Neues Konto erstellen</h2>

        <div class="form-group">
          <label>👤 Name</label>
          <input type="text" id="name" placeholder="Dein Name">
        </div>

        <div class="form-group">
          <label>📧 Email</label>
          <input type="email" id="email" placeholder="Deine Email">
        </div>

        <div class="form-group">
          <label>🔒 Passwort</label>
          <input type="password" id="passwort1" placeholder="Dein Passwort">
        </div>

        <div class="form-group">
          <label>🔒 Passwort wiederholen</label>
          <input type="password" id="passwort2" placeholder="Passwort wiederholen">
        </div>

        <button class="order-btn" id="registrierBtn">✅ Registrieren</button>

      </section>
    </main>
    <footer>
      <p>© 2026 KonzertTickets – Alle Rechte vorbehalten</p>
    </footer>
    <script src="js/auth.js"></script>
  </body>
</html>
